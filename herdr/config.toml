onboarding = false

[ui.toast]
delivery = "system"

[ui]
show_agent_labels_on_pane_borders = true

# Direct ctrl+alt chords sit beside the default ctrl+b prefix bindings.
# Letter chords also bind the Hangul jamo on the same 2-set key so they work with Korean input.
[keys]
focus_pane_left = ["prefix+h", "ctrl+alt+left"]
focus_pane_down = ["prefix+j", "ctrl+alt+down"]
focus_pane_up = ["prefix+k", "ctrl+alt+up"]
focus_pane_right = ["prefix+l", "ctrl+alt+right"]
# Ghostty does not send ctrl+alt+tab as a distinct chord, so use semicolon.
last_pane = "ctrl+alt+semicolon"
split_vertical = ["prefix+v", "ctrl+alt+d", "ctrl+alt+ㅇ"]
split_horizontal = ["prefix+minus", "ctrl+alt+shift+d", "ctrl+alt+shift+ㅇ"]
zoom = ["prefix+z", "ctrl+alt+z", "ctrl+alt+ㅋ"]
close_pane = ["prefix+x", "ctrl+alt+w", "ctrl+alt+ㅈ"]
new_tab = ["prefix+c", "ctrl+alt+t", "ctrl+alt+ㅅ"]
previous_tab = ["prefix+p", "ctrl+alt+["]
next_tab = ["prefix+n", "ctrl+alt+]"]
new_workspace = ["prefix+shift+n", "ctrl+alt+shift+n", "ctrl+alt+shift+ㅜ"]
previous_workspace = "ctrl+alt+shift+["
next_workspace = "ctrl+alt+shift+]"
switch_workspace = "ctrl+alt+shift+1..9"
